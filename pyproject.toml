[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sokolov-vision"
version = "0.2.0"
description = "Учебный классификатор присутствия человека и activation maximization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = [
  "torch",
  "torchvision",
  "scikit-learn",
  "Pillow",
  "ImageHash",
  "numpy",
  "matplotlib",
  "Markdown",
  "opencv-python-headless<4.12",
  "scikit-image",
  "insightface==0.7.3",
  "onnxruntime",
  "kagglehub",

]

[project.scripts]
sokolov = "sokolov.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sokolov.backbones" = ["NOTICE.md", "LICENSE.insightface"]
"sokolov" = ["web_ui.html"]
