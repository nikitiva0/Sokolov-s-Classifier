[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sokolov-vision"
version = "0.1.0"
description = "Учебный классификатор присутствия человека и activation maximization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = [
  "torch",
  "torchvision",
  "scikit-learn",
  "Pillow",
  "ImageHash",
  "numpy",
  "matplotlib",
]

[project.scripts]
sokolov = "sokolov.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
