# План эксперимента. Значения предстоит проверить на реальных данных.
[data]
variant = "face_crop"
raw_manifest = "data/manifests/raw.csv"
prepared_manifest = "data/processed/face_crop/manifest.csv"
artifacts_dir = "outputs/runs"
phash_max_distance = 6
positive_dir = "data/raw/sokolov_positive_v1"
fairface_handle = "mehmoodsheikh/fairface-dataset"
fairface_dir = ""
negative_count = 5000
detector_root = "checkpoints/insightface"
detector_name = "buffalo_l"
detector_threshold = 0.5
min_detector_coverage = 0.8

[model]
architecture = "resnet18"
backbone = "resnet18"
weights = "IMAGENET1K_V1"
image_size = 224
embedding_dim = 512
checkpoint = ""

[split]
validation_fraction = 0.15
test_fraction = 0.15
mode = "random_stratified"
seed = 42

[training]
batch_size = 32
head_epochs = 5
finetune_epochs = 10
head_lr = 0.001
finetune_lr = 0.0001
weight_decay = 0.0001
selection_metric = "average_precision"
device = "auto"
num_workers = 2

[generation]
steps = 500
lr = 0.05
tv_weight = 0.0001
l2_weight = 0.00001
seeds = [0, 1, 2, 3, 4]
snapshot_every = 25
