# План эксперимента. Значения предстоит проверить на реальных данных.
[data]
variant = "face_crop"
raw_manifest = "data/manifests/raw.csv"
prepared_manifest = "data/processed/face_crop/manifest.csv"
artifacts_dir = "outputs/runs"
phash_max_distance = 6

[model]
architecture = "resnet18"
backbone = "resnet18"
weights = "IMAGENET1K_V1"
image_size = 224
embedding_dim = 512
checkpoint = ""

[split]
validation_fraction = 0.2
seed = 42

[training]
batch_size = 32
head_epochs = 5
finetune_epochs = 10
head_lr = 0.001
finetune_lr = 0.0001
weight_decay = 0.0001
selection_metric = "average_precision"

[generation]
steps = 500
lr = 0.05
tv_weight = 0.0001
l2_weight = 0.00001
seeds = [0, 1, 2, 3, 4]
snapshot_every = 25
