# Локальный запуск Apple Silicon: строго MPS, без CPU fallback.
[data]
variant = "face_crop"
raw_manifest = "data/manifests/now/raw.csv"
prepared_manifest = "data/processed/now/manifest.csv"
artifacts_dir = "outputs/runs"
phash_max_distance = 6
positive_dir = "data/raw/sokolov_positive_v1"
fairface_handle = "mehmoodsheikh/fairface-dataset"
fairface_dir = "data/raw/fairface_snapshot"
negative_count = 2500
detector_root = "checkpoints/insightface"
detector_name = "buffalo_l"
detector_threshold = 0.5
min_detector_coverage = 0.8
extra_manifest = "data/manifests/now/user_v3.csv"
reuse_prepared_manifest = ""

[model]
architecture = "arcface"
backbone = "iresnet50"
weights = "MS1MV3"
image_size = 112
embedding_dim = 512
face_preprocessing = "identity_v1"
checkpoint = "checkpoints/arcface/iresnet50_ms1mv3.pt"
checkpoint_url = ""
checkpoint_sha256 = "ef005ba502a2d0f40e7b94245054d3a23e375776f7035080fcbce45ae49cfb01"

[split]
validation_fraction = 0.15
test_fraction = 0.15
mode = "group_stratified"
train_only_sources = ["user_v3:g01_podcast_dark_sokolov", "user_v3:g02_studio_light_sokolov", "user_v3:g03_stage_talk", "user_v3:g08_photo_036", "user_v3:g09_photo_037", "user_v3:g10_podcast_dark_others", "user_v3:g11_studio_light_016", "user_v3:g13_studio_light_019"]
seed = 42

[training]
batch_size = 32
head_epochs = 8
finetune_epochs = 0
head_lr = 0.001
finetune_lr = 0.0001
weight_decay = 0.0001
selection_metric = "source_macro_ap"
augmentation = "robust"
source_balanced = true
device = "mps"
num_workers = 0

[generation]
steps = 300
lr = 0.05
tv_weight = 0.0001
l2_weight = 0.00001
seeds = [0, 1, 2, 3, 4]
snapshot_every = 25
